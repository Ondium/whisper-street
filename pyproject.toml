[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-street"
version = "0.1.0"
description = "Voice isolation and transcription pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ondium" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "httpx"]

[project.scripts]
whisper-street = "whisper_street.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/ondium/whisper-street"
Documentation = "https://github.com/ondium/whisper-street/blob/main/docs/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whisper_street = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
packages = ["whisper_street"]
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
