name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Language-independent checks. These run on every commit and always apply.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Check hygiene, required docs, and internal links
        run: python .github/scripts/check_repo_hygiene.py

  # ---------------------------------------------------------------------------
  # Detect which ecosystems are present. The prototype import is in progress and
  # this repository is polyglot, so the language jobs below activate themselves
  # when their manifests appear rather than failing on their absence.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect project ecosystems
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          set -euo pipefail
          python=false
          node=false
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            python=true
          fi
          if [ -f package.json ]; then
            node=true
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "Detected — python: $python, node: $node"

  python:
    name: Python (${{ matrix.python-version }})
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Lint
        run: |
          if pip show ruff >/dev/null 2>&1; then
            ruff check .
            ruff format --check .
          else
            echo "::notice::ruff not a dependency; skipping lint"
          fi

      - name: Type check
        run: |
          if pip show mypy >/dev/null 2>&1; then
            mypy .
          else
            echo "::notice::mypy not a dependency; skipping type check"
          fi

      - name: Test
        run: |
          if pip show pytest >/dev/null 2>&1; then
            pytest -q
          else
            echo "::error::Python project detected but pytest is not a dev dependency"
            exit 1
          fi

  node:
    name: Node (${{ matrix.node-version }})
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        run: npm run --if-present lint

      - name: Type check
        run: npm run --if-present typecheck

      - name: Build
        run: npm run --if-present build

      - name: Test
        run: npm run --if-present test

  # ---------------------------------------------------------------------------
  # Single required status check. Branch protection points at this one job, so
  # the ruleset does not need editing every time a language job is added.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    if: always()
    needs: [hygiene, detect, python, node]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          # Passed via env rather than interpolated into the script, so job
          # outputs can never be parsed as shell.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results="$NEEDS_JSON"
          echo "$results"
          if echo "$results" | grep -q '"result": *"failure"'; then
            echo "::error::At least one CI job failed"
            exit 1
          fi
          if echo "$results" | grep -q '"result": *"cancelled"'; then
            echo "::error::At least one CI job was cancelled"
            exit 1
          fi
          echo "All jobs passed or were skipped."
